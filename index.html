(function () { var t = null; try { t = localStorage.getItem('atlas.theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  try { if (localStorage.getItem('atlas.rail') === 'off') document.documentElement.dataset.rail = 'off'; } catch (e) {} })();

<style>
/* Layout: a museum catalogue. Figure first, then the name set very large, then the prose.
   A quiet chapter rail on the left, everything else ink on one warm paper colour; dark mode swaps paper and ink. */
:root {
  --paper: #EFEDE6;
  --paper-2: #E7E4DB;      /* code wells, pressed states */
  --ink: #181816;
  --ink-2: #4A4842;        /* secondary text */
  --ink-3: #85827A;        /* tertiary, hints */
  --rule: rgba(24,24,22,.14);
  --acc: #C96442;          /* the key idea, same clay as the figures */
  --blue: #2E5E8C; --green: #5E7D32; --gold: #B8892B;
  --tk-k: #8A3B22; --tk-s: #4E6A2A; --tk-n: #2E5E8C;
  --serif: "Newsreader", "Noto Serif", Georgia, "Times New Roman", serif;
  --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --rail: 300px;
  --measure: 64ch;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --paper: #1A1916;
  --paper-2: #25241F;
  --ink: #ECE9E1;
  --ink-2: #B9B5AA;
  --ink-3: #8B877D;
  --rule: rgba(236,233,225,.14);
  --acc: #D9785A;
  --blue: #7AA5D1; --green: #93AE5F; --gold: #D6AA4C;
  --tk-k: #E39477; --tk-s: #A9C37A; --tk-n: #8FB6DE;
  color-scheme: dark;
}
html[lang="ko"] { --serif: "Newsreader", "Noto Serif KR", serif; --sans: "Hanken Grotesk", "Noto Sans KR", system-ui, sans-serif; }
html[lang="ja"] { --serif: "Newsreader", "Noto Serif JP", serif; --sans: "Hanken Grotesk", "Noto Sans JP", system-ui, sans-serif; }
html[lang="zh"] { --serif: "Newsreader", "Noto Serif SC", serif; --sans: "Hanken Grotesk", "Noto Sans SC", system-ui, sans-serif; }
html[lang="ar"] { --serif: "Noto Naskh Arabic", "Newsreader", serif; --sans: "Noto Sans Arabic", "Hanken Grotesk", system-ui, sans-serif; }
html[lang="hi"] { --serif: "Newsreader", "Noto Serif Devanagari", serif; --sans: "Hanken Grotesk", "Noto Sans Devanagari", system-ui, sans-serif; }
html[lang="ru"] { --serif: "Newsreader", "Noto Serif", serif; }

* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { margin: 0; font: 400 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid transparent; transition: border-color .3s; }
.bar.scrolled { border-bottom-color: var(--rule); }
.bar-in { display: flex; align-items: center; gap: 12px; height: 60px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.mark { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--serif); font-size: 21px; letter-spacing: -.01em; white-space: nowrap; }
.mark svg { width: 22px; height: 22px; }
.bar-sp { flex: 1; }
.tbtn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 999px; font-size: 14px; color: var(--ink-2); transition: background .15s, color .15s; }
.tbtn:hover { background: var(--paper-2); color: var(--ink); }
.tbtn kbd { font: 500 11px var(--sans); color: var(--ink-3); border: 1px solid var(--rule); border-radius: 5px; padding: 1px 5px; }
.flagbtn svg { width: 24px; height: 16px; display: block; }
.themebtn { width: 36px; padding: 0; justify-content: center; }
.themebtn .sun, :root[data-theme="dark"] .themebtn .moon { display: none; }
:root[data-theme="dark"] .themebtn .sun { display: block; }
.langwrap { position: relative; }
.langmenu { position: absolute; right: 0; top: 44px; width: 228px; background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; padding: 6px; box-shadow: 0 18px 50px -20px rgba(24,24,22,.35); }
html[dir="rtl"] .langmenu { right: auto; left: 0; }
.langmenu button { display: flex; width: 100%; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 9px; font-size: 15px; text-align: start; }
.langmenu button:hover, .langmenu button[aria-checked="true"] { background: var(--paper-2); }
.langmenu svg { width: 24px; height: 16px; flex: none; }
.langmenu .code { margin-inline-start: auto; font-size: 12px; color: var(--ink-3); }

/* shell */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); gap: 0 56px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); max-width: 1480px; margin: 0 auto; }
@media (min-width: 901px) {
  :root[data-rail="off"] .shell { grid-template-columns: 40px minmax(0, 1fr); gap: 0 24px; }
  :root[data-rail="off"] .rail h2, :root[data-rail="off"] .rail ol { display: none; }
}
.railhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 10px; }
.railhead h2 { margin: 0; }
.railtog { width: 40px; height: 36px; margin-block: -6px; border-radius: 8px; display: grid; place-items: center; font-size: 34px; line-height: 1; color: var(--ink-3); }
.railtog:hover { background: var(--paper-2); color: var(--ink); }
html[dir="rtl"] .railtog { transform: scaleX(-1); }
.rail { position: sticky; top: calc(60px + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100vh - 60px - env(safe-area-inset-top, 0px)); overflow: auto; padding-block: 28px 40px; scrollbar-width: thin; }
.rail h2 { font: 500 13px var(--sans); color: var(--ink-3); }
.rail ol { list-style: none; margin: 0; padding: 0; }
.rail > ol > li { border-top: 1px solid var(--rule); }
.chap { display: grid; grid-template-columns: 26px 1fr auto; align-items: baseline; gap: 6px; width: 100%; padding: 9px 2px; text-align: start; font-size: 14.5px; color: var(--ink-2); }
.chap .no { font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: 12.5px; }
.chap .ct { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.chap:hover, .chap[aria-expanded="true"] { color: var(--ink); }
.sub { padding: 0 0 10px 32px; }
html[dir="rtl"] .sub { padding: 0 32px 10px 0; }
.sub a { display: block; padding: 3px 0; font-size: 13.5px; line-height: 1.4; color: var(--ink-3); text-decoration: none; }
.sub a:hover { color: var(--ink); }
.sub a[aria-current="page"] { color: var(--ink); font-weight: 500; }
.sub a[aria-current="page"]::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--acc); margin-inline-end: 7px; vertical-align: 2px; }

main { min-width: 0; padding-block: 24px 80px; }

/* stage */
.stagewrap { position: relative; }
.stagebox { position: relative; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9.2; max-height: 72vh; min-height: 300px; cursor: grab; touch-action: pan-y; }
.stage:active { cursor: grabbing; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
.zoombar { position: absolute; top: 50%; inset-inline-end: 0; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px 0; border: 1px solid var(--rule); border-radius: 999px; background: color-mix(in srgb, var(--paper) 88%, transparent); }
.zoombar button { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); }
.zoombar button:hover { background: var(--paper-2); color: var(--ink); }
.zoombar input { writing-mode: vertical-lr; direction: rtl; width: 18px; height: 132px; margin: 0; accent-color: var(--ink); cursor: pointer; }
.stagemeta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 12px 0 0; border-top: 1px solid var(--rule); font-size: 13.5px; color: var(--ink-2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.dot { width: 9px; height: 9px; border-radius: 50%; }
.stagemeta .sp { flex: 1; }
.hint { color: var(--ink-3); }
.linkbtn { color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; font-size: 13.5px; }
.linkbtn:hover { color: var(--ink); text-decoration-color: currentColor; }
.ctlrow { display: flex; align-items: center; gap: 14px; padding-top: 10px; font-size: 13.5px; color: var(--ink-2); }
.ctlrow label { font-family: var(--mono); font-size: 13px; }
.ctlrow input[type=range] { flex: 1; max-width: 320px; accent-color: var(--acc); }
.ctlrow output { font: 500 13px var(--mono); min-width: 3.5ch; font-variant-numeric: tabular-nums; }
.ctlrow select { font: inherit; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 4px 8px; }

/* concept head */
.crumb { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin: 44px 0 10px; font-size: 14px; color: var(--ink-3); }
.crumb button { color: var(--ink-2); }
.crumb button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.crumb .pos { font-variant-numeric: tabular-nums; }
h1.name { font-family: var(--serif); font-weight: 380; font-size: clamp(2.6rem, 6.4vw, 6.4rem); line-height: 1.0; letter-spacing: -.022em; margin: 0; text-wrap: balance; font-optical-sizing: auto; max-width: 18ch; }
html[lang="ko"] h1.name, html[lang="ja"] h1.name, html[lang="zh"] h1.name { letter-spacing: -.035em; line-height: 1.12; font-weight: 500; }
html[lang="ar"] h1.name, html[lang="hi"] h1.name { line-height: 1.3; letter-spacing: 0; }
.term { margin: 14px 0 0; font-family: var(--serif); font-style: italic; font-size: clamp(1.1rem, 1.6vw, 1.35rem); color: var(--ink-2); }

.body { display: grid; grid-template-columns: minmax(0, var(--measure)) minmax(0, 1fr); gap: 32px 64px; margin-top: 40px; align-items: start; }
.prose { font-family: var(--serif); font-size: clamp(1.1rem, 1.25vw, 1.24rem); line-height: 1.66; color: var(--ink); min-width: 0; }
.prose p { margin: 0 0 1em; }
.prose p:first-child::first-line { }
/* term links in the prose: quiet underline, clay highlight on hover */
a.tlink { color: inherit; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--acc) 60%, transparent); text-decoration-thickness: 1px; text-underline-offset: 0.22em; border-radius: 3px; transition: background-color .12s, text-decoration-color .12s; }
a.tlink:hover, a.tlink:focus-visible { background: color-mix(in srgb, var(--acc) 42%, transparent); text-decoration-color: transparent; box-shadow: 0 0 0 2px color-mix(in srgb, var(--acc) 42%, transparent); }
/* appendix pages: a close button that stays in view and returns to the page the visit started from */
.apxbar { position: sticky; top: calc(72px + env(safe-area-inset-top, 0px)); height: 0; z-index: 15; display: flex; justify-content: flex-end; }
.apxclose { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--rule); background: var(--paper); color: var(--ink-2); box-shadow: 0 10px 28px -16px rgba(0,0,0,.45); }
.apxclose:hover { background: var(--paper-2); color: var(--ink); }
html[lang="ko"] .prose, html[lang="ja"] .prose, html[lang="zh"] .prose { line-height: 1.85; word-break: keep-all; }
html[lang="ar"] .prose { line-height: 1.95; }
.aside { min-width: 0; display: grid; gap: 28px; padding-top: 6px; }
.aside h3, .acc summary { font: 500 13.5px var(--sans); color: var(--ink-3); margin: 0 0 8px; }
.formula { font-family: var(--mono); font-size: 15px; line-height: 1.6; color: var(--ink); overflow-x: auto; white-space: pre-wrap; word-break: break-word; border-inline-start: 2px solid var(--acc); padding-inline-start: 14px; margin: 0; }
.uses { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.uses li { padding: 10px 0; border-top: 1px solid var(--rule); font-size: 15px; line-height: 1.45; color: var(--ink-2); }
.uses li:last-child { border-bottom: 1px solid var(--rule); }

/* disclosures */
.accs { margin-top: 48px; border-top: 1px solid var(--ink); max-width: calc(var(--measure) + 64px + 420px); }
.acc { border-bottom: 1px solid var(--rule); }
.acc summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 16px; padding: 20px 0; margin: 0; font: 400 clamp(1.25rem, 1.8vw, 1.6rem)/1.2 var(--serif); color: var(--ink); }
.acc summary::-webkit-details-marker { display: none; }
.acc summary .pm { margin-inline-start: auto; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--rule); display: grid; place-items: center; transition: transform .25s, background .2s; flex: none; }
.acc summary:hover .pm { background: var(--paper-2); }
.acc[open] summary .pm { transform: rotate(45deg); }
.acc summary .sm { font: 400 14px var(--sans); color: var(--ink-3); }
.acc .in { padding: 0 0 28px; max-width: 80ch; }
.acc .in p { font-family: var(--serif); font-size: 1.12rem; line-height: 1.7; margin: 0; }
.acc .uses li { font-size: 16px; }
.code { position: relative; background: var(--paper-2); border-radius: 12px; overflow: hidden; }
.code pre { margin: 0; padding: 20px 22px; overflow-x: auto; font: 400 13.5px/1.7 var(--mono); color: var(--ink); tab-size: 4; direction: ltr; text-align: left; }
.code .cp { position: absolute; top: 10px; right: 10px; font-size: 12.5px; padding: 5px 11px; border-radius: 999px; background: var(--paper); border: 1px solid var(--rule); color: var(--ink-2); }
.code .cp:hover { color: var(--ink); }
.tk-k { color: var(--tk-k); } .tk-s { color: var(--tk-s); } .tk-c { color: var(--ink-3); font-style: italic; } .tk-n { color: var(--tk-n); } .tk-f { color: var(--ink); font-weight: 500; }

/* prev / next */
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 72px; border-top: 1px solid var(--rule); }
.pn a { display: block; padding: 22px 0 0; text-decoration: none; color: var(--ink-2); min-width: 0; }
.pn a:last-child { text-align: end; }
.pn small { display: block; font-size: 13px; color: var(--ink-3); margin-bottom: 6px; }
.pn span { font-family: var(--serif); font-size: clamp(1.15rem, 2vw, 1.6rem); line-height: 1.2; color: var(--ink); }
.pn a:hover span { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; }
.keys { margin-top: 36px; font-size: 13px; color: var(--ink-3); }

/* home */
.home h1 { font-family: var(--serif); font-weight: 340; font-size: clamp(3.2rem, 10vw, 9.5rem); line-height: .92; letter-spacing: -.035em; margin: 0; }
.home .lead { font-family: var(--serif); font-size: clamp(1.15rem, 1.7vw, 1.5rem); line-height: 1.5; max-width: 40ch; color: var(--ink-2); margin: 24px 0 0; }
.homehead { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 24px 48px; align-items: end; margin-top: 16px; }
.stats { display: flex; gap: 40px; margin-top: 36px; font-size: 14px; color: var(--ink-3); }
.stats b { display: block; font: 400 2.4rem/1 var(--serif); color: var(--ink); font-variant-numeric: tabular-nums; margin-bottom: 4px; }
.cta { display: inline-flex; align-items: center; gap: 10px; margin-top: 32px; height: 46px; padding: 0 22px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 15px; text-decoration: none; }
.cta:hover { background: color-mix(in srgb, var(--ink) 86%, var(--paper)); }
.feat { position: relative; }
.feat .stage { aspect-ratio: 1 / .82; max-height: 64vh; }
.feat figcaption { display: flex; gap: 8px; justify-content: space-between; align-items: baseline; font-size: 13.5px; color: var(--ink-3); border-top: 1px solid var(--rule); padding-top: 10px; }
.feat figcaption a { color: var(--ink); text-decoration: none; font-family: var(--serif); font-size: 1.1rem; }
.feat figcaption a:hover { text-decoration: underline; text-underline-offset: 4px; }
.toc { margin-top: 88px; }
.toc > h2 { font: 400 clamp(1.6rem, 2.6vw, 2.2rem) var(--serif); margin: 0 0 18px; }
.toc > h2.apxh { margin-top: 72px; }
.rail .apxh { margin: 26px 0 10px; }
.tocrow { display: grid; grid-template-columns: 64px minmax(0, 22ch) minmax(0, 1fr); gap: 8px 28px; padding: 22px 0; border-top: 1px solid var(--rule); align-items: baseline; }
.tocrow .no { font: 400 1.6rem var(--serif); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tocrow h3 { margin: 0; font: 400 clamp(1.3rem, 2vw, 1.75rem)/1.15 var(--serif); }
.tocrow h3 small { display: block; font: 400 13px var(--sans); color: var(--ink-3); margin-top: 6px; }
.tocrow .list { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14.5px; line-height: 1.5; }
.tocrow .list a { color: var(--ink-2); text-decoration: none; }
.tocrow .list a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
footer { margin-top: 80px; padding-top: 18px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--ink-3); max-width: 70ch; }


/* search */
.herosearch { margin-top: 64px; }
.sx { position: relative; }
.sx-field { display: flex; align-items: center; gap: 14px; border-bottom: 1.5px solid var(--ink); padding: 6px 2px 10px; color: var(--ink-2); }
.sx-field:focus-within { color: var(--ink); }
.sx-field input { flex: 1; min-width: 0; font: 400 clamp(1.35rem, 2.6vw, 2.1rem)/1.25 var(--serif); background: none; border: 0; outline: none; color: var(--ink); padding: 4px 0; }
.sx-field input::placeholder { color: var(--ink-3); }
.sx-field input::-webkit-search-cancel-button { display: none; }
.sx-clear { font-size: 26px; line-height: 1; color: var(--ink-3); width: 32px; height: 32px; border-radius: 50%; }
.sx-clear:hover { background: var(--paper-2); color: var(--ink); }
.sx-sug { position: absolute; z-index: 5; inset-inline: 0; top: 100%; margin: 6px 0 0; padding: 6px; list-style: none; background: var(--paper); border: 1px solid var(--rule); border-radius: 14px; box-shadow: 0 22px 50px -24px rgba(24,24,22,.4); }
.sx-sug li { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 9px; cursor: pointer; font-size: 16px; color: var(--ink); }
.sx-sug li svg { color: var(--ink-3); flex: none; }
.sx-sug li small { margin-inline-start: auto; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.sx-sug li[aria-selected="true"], .sx-sug li:hover { background: var(--paper-2); }
.sx-sug mark, .sx-list mark { background: none; color: var(--acc); }
.sx-count { margin: 22px 0 6px; font-size: 13.5px; color: var(--ink-3); }
.sx-list { list-style: none; margin: 0; padding: 0; }
.sx-list li { border-top: 1px solid var(--rule); }
.sx-row { display: grid; grid-template-columns: minmax(0, 13rem) minmax(0, 1fr); gap: 4px 28px; padding: 16px 0; text-decoration: none; color: var(--ink); }
.sx-row:hover .sx-nm { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.sx-ch { grid-row: span 2; font-size: 13px; color: var(--ink-3); padding-top: 6px; }
.sx-nm { font: 400 clamp(1.15rem, 1.6vw, 1.4rem)/1.25 var(--serif); }
.sx-nm small { font: italic 400 0.85rem var(--serif); color: var(--ink-3); margin-inline-start: 6px; }
.sx-sn { font-size: 14.5px; line-height: 1.55; color: var(--ink-2); max-width: 78ch; }
.sx-empty { font-family: var(--serif); font-size: 1.2rem; color: var(--ink-2); margin: 24px 0; }
.ix-field { flex: 1; min-width: 0; }
.ix-res { max-width: 1100px; margin: 8px auto 0; }
@media (max-width: 700px) { .sx-row { grid-template-columns: minmax(0, 1fr); } .sx-ch { grid-row: auto; padding: 0; } }

/* index overlay */
.ix { position: fixed; inset: 0; z-index: 40; background: var(--paper); overflow: auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: calc(env(safe-area-inset-top, 0px) + 18px) 60px; }
.ix-top { display: flex; align-items: center; gap: 16px; max-width: 1400px; margin: 0 auto; position: sticky; top: 0; background: var(--paper); padding: 6px 0 14px; z-index: 2; }
.ix-grid { max-width: 1400px; margin: 24px auto 0; columns: 4 260px; column-gap: 40px; }
.ix-sec { break-inside: avoid; margin-bottom: 30px; }
.ix-sec h3 { margin: 0 0 8px; font: 400 1.25rem var(--serif); display: flex; gap: 10px; align-items: baseline; }
.ix-sec h3 span { font: 400 13px var(--sans); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.ix-sec a { display: block; padding: 3px 0; font-size: 14.5px; color: var(--ink-2); text-decoration: none; line-height: 1.4; }
.ix-sec a:hover { color: var(--ink); }
.ix-sec a mark { background: none; color: var(--acc); }
.ix-sec a small { color: var(--ink-3); font-size: 12.5px; margin-inline-start: 6px; }
.ix-empty { max-width: 1400px; margin: 40px auto; font-family: var(--serif); font-size: 1.3rem; color: var(--ink-2); }

.fade { animation: fadein .45s ease both; }
@keyframes fadein { from { opacity: .0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.skel { color: var(--ink-3); font-style: italic; }

@media (max-width: 1100px) {
  .body { grid-template-columns: minmax(0, 1fr); }
  .aside { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px 40px; }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .homehead { grid-template-columns: minmax(0, 1fr); }
  .tocrow { grid-template-columns: 44px minmax(0, 1fr); }
  .tocrow .list { grid-column: 2; }
  .hide-sm { display: none; }
}
@media (max-width: 520px) {
  .bar-in { gap: 4px; }
  .mark span { display: none; }
  .stage { aspect-ratio: 1 / 1; max-height: 60vh; }
  .stats { gap: 24px; }
  .pn { grid-template-columns: minmax(0, 1fr); }
  .pn a:last-child { text-align: start; }
}
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } * { transition: none !important; } }
